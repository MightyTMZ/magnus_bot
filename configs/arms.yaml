# Arm placement, motion limits, and per-arm hardware wiring.
# Distances in meters, gripper in percent (0..100). PLACEHOLDER values until measured.
#
# Ports live here, never hardcoded. On Windows these are COM ports (one per arm).
# Calibration ids map to LeRobot calibration files:
#   ~/.cache/huggingface/lerobot/calibration/robots/so_follower/<calibration_id>.json

# d: gap from each arm's base yaw axis (center of the shoulder_pan servo) to the near board edge.
# PER-ARM (MEASURED 2026-10-24): the two arms are NOT equidistant, so follower_1 reaches ~1.8 cm
# less of the board than follower_2. A single scalar here is still accepted (applied to both arms).
edge_gap:
  follower_1: 0.078  # CAMERA-FITTED 2026-10-24 (scripts/fit_arm_geometry.py, 7 probes): the base is
                     # close to the ruler value (0.085); the arm itself falls 33 mm short (see
                     # reach_correction). The earlier 0.114 put all of that shortfall into the base
                     # position, which left pan angles too small: 7-20 mm misses to the arm's right
                     # toward rank 1 (g3/g4/h4), and to its left toward rank 8 (g6).
  follower_2: 0.067  # ruler value, NOT yet probed: probably off the same way; probe before trusting.

# Where each real arm lands vs its model; added to every commanded fingertip target (m).
# reach / side: CAMERA-FITTED by scripts/fit_arm_geometry.py from reach_probe logs (rms 10.4 -> 4.2 mm).
# z: by ruler (reach_probe.py --ask-height): commanded 10 mm, tip at 6 / 6 / 3.5 mm on g4/g5/h4.
reach_correction:   # the arm falls this much SHORT along its reach
  follower_1: 0.033
side_correction:    # the arm lands this much to its RIGHT (+ = command further to its left)
  follower_1: 0.002
z_correction:       # the arm sits this much LOWER than the model
  follower_1: 0.005

# Default trajectory speed scale (0..1). Conservative by default.
speed_scale: 0.3

# Traverse height for the hover/traverse phases. MUST exceed the tallest piece + margin, AND
# account for the piece hanging below the grasp point. Set 2026-10-24: king 9.9cm + ~1cm
# clearance + 2.8cm pawn grasp offset => ~13.7cm, rounded to 14cm.
z_clear: 0.140

# Gripper height when grasping a piece standing on the board. MEASURED 2026-10-24 for the PAWN.
# TODO(M2/M3): make grasp height per-piece-type (keyed like piece_heights) instead of one value.
z_grasp: 0.028

# Gripper positions (percent). gripper_open is a single safe-wide value. gripper_closed here is
# the DEFAULT (pawn) hold; per-piece closed values live in board.yaml:gripper_closed_pct (they
# differ by piece) and will supersede this default when per-piece grasp lands (M2/M3).
gripper_open: 35.0       # follower_1 approach width (2026-10-24): wide enough to drop around a
                         # stem but NOT full-open (77) — full-open fouls neighbouring pieces.
gripper_closed: 4.15     # MEASURED 2026-10-24: ROOK hold (the first-move test piece). Per-piece
                         # values live in board.yaml:gripper_closed_pct; this default = rook for now.

arms:
  follower_1:
    port: COM3            # beyond the h-file edge, facing -x (toward the a-file)
    calibration_id: follower_1
  follower_2:
    port: COM4            # beyond the a-file edge, facing +x (toward the h-file)
    calibration_id: follower_2
