# Arm placement, motion limits, and per-arm hardware wiring.
# Distances in meters, gripper in percent (0..100). PLACEHOLDER values until measured.
#
# Ports live here, never hardcoded. On Windows these are COM ports (one per arm).
# Calibration ids map to LeRobot calibration files:
#   ~/.cache/huggingface/lerobot/calibration/robots/so_follower/<calibration_id>.json

# d: gap from each arm's base yaw axis (center of the shoulder_pan servo) to the near board edge.
# PER-ARM (MEASURED 2026-10-24): the two arms are NOT equidistant, so follower_1 reaches ~1.8 cm
# less of the board than follower_2. A single scalar here is still accepted (applied to both arms).
edge_gap:
  follower_1: 0.076  # CAMERA-FITTED 2026-10-25 (scripts/fit_arm_geometry.py, 7 clean probes): the base is
                     # close to the ruler value (0.085); the arm itself falls 33 mm short (see
                     # reach_correction). The earlier 0.114 put all of that shortfall into the base
                     # position, which left pan angles too small: 7-20 mm misses to the arm's right
                     # toward rank 1 (g3/g4/h4), and to its left toward rank 8 (g6).
  follower_2: 0.069  # CAMERA-FITTED 2026-10-25 (10 probes a3-c6; rms 9.0 -> 3.0 mm with lateral_correction)

# Where each real arm lands vs its model; added to every commanded fingertip target (m).
# reach / side: CAMERA-FITTED by scripts/fit_arm_geometry.py from reach_probe logs (2026-10-25 refit from
# g3-g6 + g4/h4/h6 after recalibrating the camera; rms 8.2 -> 6.9 mm; operator saw g4/h4/h6 centred).
# An h-file probe that read the tip ~38 mm past the board edge was a marker artefact: excluded.
# z: by ruler (reach_probe.py --ask-height): commanded 10 mm, tip at 6 / 6 / 3.5 mm on g4/g5/h4.
reach_correction:   # the arm falls this much SHORT along its reach
  follower_1: 0.036
  follower_2: -0.008
side_correction:    # the arm lands this much to its RIGHT (+ = command further to its left)
  follower_1: 0.007  # toward rank 1; f-file grasps closed toward rank 8 at 0.002
  follower_2: 0.015
lateral_correction: # the BASE sits this much to the arm's RIGHT of where edge_gap / the board centre
                    # line put it (a fixed shift: squares on one side land long, the other short)
  follower_2: -0.015  # i.e. 15 mm to its LEFT (toward rank 8): rank 3 landed -4 mm, rank 6 +14 mm
z_correction:       # the arm sits this much LOWER than the model
  follower_1: 0.005
  follower_2: 0.006  # ruler, first follower_2 probe 2026-10-25 (-6.2 mm on average)

# Every grasp aims this far to the arm's LEFT of the square's centre (m; rank 1 for follower_1), on
# top of each tuned grasp's own side_offset_mm. The jaws open to one side of the aim point, so dead
# centre lands a jaw on the piece's head. 2026-10-25: f-file and g4g5 grasps still came down on the
# heads; operator: +2-3 mm more -> 3 mm.
# Per arm, per square: [reach, side] mm added to the aim at that square only (pick or place, any
# piece); + = further from the arm / to its left. For single squares where an arm lands a bit off.
# "square:piece" (e.g. "e3:bishop") applies to that piece only and wins over the plain square.
square_nudge_mm:
  follower_1:
    f7: [4, -4]  # 2026-10-25: the queen landed short and left of f7 (Qxf7); operator: front-right
    e3: [0, 2]   # 2026-10-25: picking the queen off the pad (Qh5 leg 2): 2 mm more on top of the
                 # queen's h5 offset (6 -> 8 mm at e3; h5 keeps 6)
    "e3:bishop": [4, -4]  # 2026-10-25: Bc4's drop-off on the pad landed short of the square:
                          # release further toward the a-file (reach) and rank 8 (the arm's right)

grasp_side_offset:
  follower_1: 0.003
  follower_2: -0.003  # its wrist roll sits ~180 deg off, so the jaws open to the mirrored side:
                      # rook c4c5 60/-9 live 2026-10-25: -3 mm 4/4, 0 1/2, +3 2/2

# Default trajectory speed scale (0..1). Conservative by default.
speed_scale: 0.3
# Long travel moves (rest <-> above the board, square to square at travel height) run this much
# faster; the moves near the pieces (descend, grip, release, lift) stay at speed_scale. 2026-10-25:
# operator asked +25%. Peak joint speed then ~32 deg/s, well under the 120 deg/s per-command clamp.
travel_speedup: 1.25
# The rise straight up after a pick and after a place runs this much faster (peak ~52 deg/s at 2.0):
# 2026-10-25 at e3 (follower_1's far reach) the elbow lagged on the slow rise and the arm pulled back
# while still down, knocking over the bishop it had just placed.
rise_speedup: 2.0

# Traverse height for the hover/traverse phases. MUST exceed the tallest piece + margin, AND
# account for the piece hanging below the grasp point. Set 2026-10-24: king 9.9cm + ~1cm
# clearance + 2.8cm pawn grasp offset => ~13.7cm, rounded to 14cm.
z_clear: 0.140

# Gripper height when grasping a piece standing on the board. MEASURED 2026-10-24 for the PAWN.
# TODO(M2/M3): make grasp height per-piece-type (keyed like piece_heights) instead of one value.
z_grasp: 0.028

# Gripper positions (percent). gripper_open is a single safe-wide value. gripper_closed here is
# the DEFAULT (pawn) hold; per-piece closed values live in board.yaml:gripper_closed_pct (they
# differ by piece) and will supersede this default when per-piece grasp lands (M2/M3).
gripper_open: 26.0       # follower_1 approach width. 35 (2026-10-24) still knocked neighbouring
                         # pieces as the jaws opened (first real game moves, 2026-10-25): -25%.
                         # Full-open (77) fouls neighbours badly.
gripper_closed: 4.15     # MEASURED 2026-10-24: ROOK hold (the first-move test piece). Per-piece
                         # values live in board.yaml:gripper_closed_pct; this default = rook for now.

arms:
  follower_1:
    port: COM3            # beyond the h-file edge, facing -x (toward the a-file)
    calibration_id: follower_1
  follower_2:
    port: COM4            # beyond the a-file edge, facing +x (toward the h-file)
    calibration_id: follower_2
